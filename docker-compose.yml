services:
  postgres:
    image: postgres:16-alpine
    container_name: mehr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mehr_accounting
    ports:
      - '5432:5432'
    volumes:
      - mehr_pg_data:/var/lib/postgresql/data

volumes:
  mehr_pg_data:
