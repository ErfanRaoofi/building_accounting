@if (open()) {
  <button class="ui-overlay z-[80]" type="button" (click)="close()" aria-label="بستن" animate.enter="ui-overlay-enter" animate.leave="ui-overlay-leave"></button>
  <div class="pointer-events-none fixed inset-0 z-[81] flex items-end justify-center sm:items-center sm:p-6 print:hidden">
    <div
      class="pointer-events-auto flex max-h-[92dvh] w-full max-w-md flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:rounded-3xl"
      role="dialog"
      aria-modal="true"
      aria-label="تنظیم تصویر فیش"
      animate.enter="ui-modal-enter"
      animate.leave="ui-modal-leave"
    >
      <header class="flex items-start justify-between gap-3 border-b border-slate-100 px-5 py-4">
        <div>
          <h2 class="text-lg font-bold text-slate-900">تنظیم تصویر فیش</h2>
          <p class="ui-muted mt-1">همهٔ تصویر داخل قاب است. برای بریدن اطراف، بزرگ‌نمایی کنید.</p>
        </div>
        <button class="ui-btn-ghost h-10 w-10 shrink-0 px-0" type="button" (click)="close()" aria-label="بستن">✕</button>
      </header>
      <div class="min-h-0 flex-1 space-y-4 overflow-y-auto bg-slate-50 px-5 py-5">
        @if (src() && !naturalW() && !error()) {
          <div class="grid h-56 place-items-center rounded-2xl bg-white text-sm text-slate-500 ring-1 ring-slate-200">در حال خواندن تصویر...</div>
        }
        @if (naturalW()) {
          <div class="flex justify-center">
            <div
              class="relative overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200"
              [class.cursor-grab]="zoom() > 1"
              [class.touch-none]="zoom() > 1"
              [style.width.px]="frameW()"
              [style.height.px]="frameH()"
              (pointerdown)="startPan($event)"
              (pointermove)="movePan($event)"
              (pointerup)="endPan()"
              (pointercancel)="endPan()"
              (wheel)="onWheel($event)"
            >
              <img
                class="absolute max-w-none select-none"
                [src]="src()"
                alt=""
                draggable="false"
                [style.left.px]="originX()"
                [style.top.px]="originY()"
                [style.width.px]="dispW()"
                [style.height.px]="dispH()"
              />
            </div>
          </div>
        }
        <label class="ui-field rounded-2xl bg-white p-3 ring-1 ring-slate-200">
          <span class="ui-label flex items-center justify-between">
            <span>بزرگ‌نمایی</span>
            <span class="font-normal text-slate-500">{{ zoom() === 1 ? 'کل تصویر' : zoom() + '×' }}</span>
          </span>
          <input
            class="w-full accent-brand-700"
            type="range"
            min="1"
            max="4"
            step="0.01"
            dir="ltr"
            [disabled]="!naturalW()"
            [value]="zoom()"
            (input)="setZoom($any($event.target).value)"
          />
        </label>
        @if (error()) {
          <p class="rounded-xl bg-rose-50 px-3 py-2 text-sm font-medium text-rose-700">{{ error() }}</p>
        }
      </div>
      <div class="ui-form-actions">
        <button class="ui-btn-ghost flex-1" type="button" (click)="close()">انصراف</button>
        <button class="ui-btn-primary flex-1" type="button" [disabled]="busy() || !naturalW()" (click)="confirm()">
          @if (busy()) {
            در حال آماده‌سازی...
          } @else {
            تأیید تصویر
          }
        </button>
      </div>
    </div>
  </div>
}
