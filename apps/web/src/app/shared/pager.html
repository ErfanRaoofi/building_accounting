@if (total() > 0) {
  <div class="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-600 sm:flex-row sm:items-center sm:justify-between">
    <p>
      نمایش
      <span class="font-semibold text-slate-800">{{ fa(from()) }}</span>
      تا
      <span class="font-semibold text-slate-800">{{ fa(to()) }}</span>
      از
      <span class="font-semibold text-slate-800">{{ fa(total()) }}</span>
      @if (itemLabel()) {
        {{ itemLabel() }}
      }
    </p>
    <div class="flex flex-wrap items-center gap-2">
      <label class="flex items-center gap-2">
        <span class="text-xs">در هر صفحه</span>
        <select class="ui-input h-9 w-20 px-2" [value]="size()" (change)="changeSize($any($event.target).value)">
          @for (n of sizes; track n) {
            <option [value]="n">{{ fa(n) }}</option>
          }
        </select>
      </label>
      <button class="ui-btn-ghost h-9 px-3" type="button" [disabled]="current() <= 1" (click)="prev()">قبلی</button>
      <span class="min-w-[4.5rem] text-center text-xs font-semibold text-slate-700">
        {{ fa(current()) }} / {{ fa(pages()) }}
      </span>
      <button class="ui-btn-ghost h-9 px-3" type="button" [disabled]="current() >= pages()" (click)="next()">بعدی</button>
    </div>
  </div>
}
