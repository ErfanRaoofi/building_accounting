# Portainer stack: set DOCKERHUB_USERNAME, POSTGRES_PASSWORD, JWT_SECRET.
# Optional: WEB_PORT (default 8080), JWT_EXPIRES_IN (default 7d).
# Use an alphanumeric POSTGRES_PASSWORD (avoid @ : / # in the URL).
#
# Shared network for Nginx Proxy Manager:
#   docker network create proxy
# Attach the same external network named "proxy" to your NPM container/stack.
# In NPM Proxy Host:
#   Forward Hostname = building-accounting-web
#   Forward Port = 80
#   Scheme = http

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: building_accounting
    volumes:
      - building_accounting_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d building_accounting']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    image: ${DOCKERHUB_USERNAME}/building-accounting-api:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/building_accounting?schema=public
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/building_accounting?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    volumes:
      - building_accounting_uploads:/app/uploads
      - building_accounting_backups:/app/data/backups
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks:
      - internal

  web:
    image: ${DOCKERHUB_USERNAME}/building-accounting-web:latest
    container_name: building-accounting-web
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    networks:
      internal:
      proxy:
        aliases:
          - building-accounting-web

volumes:
  building_accounting_pg_data:
  building_accounting_uploads:
  building_accounting_backups:

networks:
  internal:
  proxy:
    external: true
