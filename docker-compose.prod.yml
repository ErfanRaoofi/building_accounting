# Portainer Stack — بدون nginx لبه (از Nginx Proxy Manager استفاده می‌شود)
# Compose path: docker-compose.prod.yml
#
# یک‌بار روی سرور: docker network create proxy-network
# NPM را به همان شبکه وصل کن.
#
# مهم: روی proxy-network نام frontend با استک hokm تداخل دارد.
# در NPM حتماً از نام یکتا استفاده کن:
#   Scheme               = http
#   Forward Hostname/IP  = building-accounting-frontend
#   Forward Port         = 4001
#
# DB_PASSWORD فقط حروف و عدد (بدون @ : / #)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-building_accounting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d building_accounting']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME}/building-accounting-api:${IMAGE_TAG_BACKEND:-latest}
    container_name: building-accounting-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-5001}:5001'
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5001
      PORT: 5001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-building_accounting}?schema=public
      DIRECT_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-building_accounting}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    volumes:
      - uploads:/app/uploads
      - backups:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      app-network:
      proxy-network:
        aliases:
          - building-accounting-backend

  frontend:
    image: ${DOCKERHUB_USERNAME}/building-accounting-web:${IMAGE_TAG_FRONTEND:-latest}
    container_name: building-accounting-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-4001}:4001'
    depends_on:
      - backend
    networks:
      app-network:
      proxy-network:
        aliases:
          - building-accounting-frontend

volumes:
  pgdata:
  uploads:
  backups:

networks:
  app-network:
    driver: bridge
  proxy-network:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}
