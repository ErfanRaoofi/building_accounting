# Portainer stack — TLS/routing via Nginx Proxy Manager (same pattern as hokm).
#
# One-time on server:
#   docker network create proxy-network
# Join the NPM container to PROXY_NETWORK (default: proxy-network).
#
# NPM Proxy Host (Docker DNS — like hokm):
#   Scheme               = http
#   Forward Hostname/IP  = frontend
#   Forward Port         = 4001
#
# DB password must be alphanumeric (avoid @ : / # in DATABASE_URL).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-building_accounting}
    volumes:
      - building_accounting_pg_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME}/building-accounting-api:${IMAGE_TAG_BACKEND:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-5000}:3000'
    environment:
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-building_accounting}?schema=public
      DIRECT_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-building_accounting}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    volumes:
      - building_accounting_uploads:/app/uploads
      - building_accounting_backups:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
      - proxy-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12

  frontend:
    image: ${DOCKERHUB_USERNAME}/building-accounting-web:${IMAGE_TAG_FRONTEND:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-4001}:4001'
    depends_on:
      - backend
    networks:
      - app-network
      - proxy-network

volumes:
  building_accounting_pg_data:
  building_accounting_uploads:
  building_accounting_backups:

networks:
  app-network:
    driver: bridge
  proxy-network:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}
